# Sürekli tümleştirme: her push ve çekme isteğinde derleme, birim testler, bağımlılık denetimi ve
# gerçek veritabanıyla uçtan uca (e2e) güvenlik/yalıtım/ticaret denemeleri çalışır.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc · jest · build · audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx jest --silent
      - run: npm run build
      # Üretim bağımlılıklarında YÜKSEK/KRİTİK açık varsa derleme kırılır (orta düzeyler docs/DEPLOYMENT.md'de açıklanır).
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (tsc · vitest · build · audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npx vitest run
      - run: npx vite build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Uçtan uca (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: stocktrack, POSTGRES_PASSWORD: stocktrack, POSTGRES_DB: stocktrack }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stocktrack" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      API: http://localhost:3000/api/v1
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: API'yi başlat
        run: |
          mkdir -p /tmp/backups
          NODE_ENV=development APP_PORT=3000 DB_HOST=localhost DB_PORT=5432 DB_USERNAME=stocktrack DB_PASSWORD=stocktrack DB_NAME=stocktrack \
          DB_SYNCHRONIZE=true REDIS_URL=redis://localhost:6379/0 TRUST_PROXY_HOPS=0 SCHEDULER_ENABLED=false \
          JWT_ACCESS_SECRET=ci-access-secret-0123456789abcdef JWT_REFRESH_SECRET=ci-refresh-secret-0123456789abcdef \
          SEED_OWNER_PASSWORD='Owner123!' BACKUP_DIR=/tmp/backups PRE_UPGRADE_BACKUP=off \
          PORTAL_BASE_URL=https://portal.sistem.example/portal \
          nohup node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$API/health" >/dev/null && exit 0; sleep 1; done
          echo "API açılmadı"; tail -50 /tmp/api.log; exit 1
      - name: Uçtan uca denemeler
        env:
          E2E_PSQL: psql -h localhost -U stocktrack -d stocktrack
          PGPASSWORD: stocktrack
        run: |
          set -e
          for t in access-matrix idor tenant-isolation session concurrency trade transfer catalog-storage platform cache; do
            # Kayıt/giriş hız sınırı sayaçları betikler arasında temizlenir (hepsi aynı IP'den çalışır).
            node -e "const R=require('ioredis');const r=new R('redis://localhost:6379');r.flushall().then(()=>r.quit())"
            echo "=== $t"; node test-e2e/$t.e2e.mjs
          done
      - if: failure()
        run: tail -100 /tmp/api.log
