# ───────────────────────────────────────────────────────────────────────────
# ÜRETİM (production) bileşimi: PostgreSQL + API (NestJS) + Web (statik, nginx).
#
# Çalıştırma:
#   1) cp backend/.env.example backend/.env   ve değerleri düzenleyin
#      (NODE_ENV=production'da JWT sırları en az 32 karakter ve örnek olmayan değerler olmalı, aksi hâlde
#      API AÇILMAZ; install.sh/install.ps1 bunları rastgele üretir. DB_SYNCHRONIZE=true — migration yoksa).
#   2) docker compose -f docker-compose.prod.yml up -d --build
#      → OWNER hesabı + varsayılanlar API açılışında OTOMATİK oluşturulur
#        (idempotent). Giriş: SEED_OWNER_EMAIL / SEED_OWNER_PASSWORD (.env).
#        Kapatmak için SEED_ON_BOOT=false. Elle: run --rm api node dist/database/seed.js
#
# Erişim (yerel ağ):  Web → http://<sunucu-ip>/    API → http://<sunucu-ip>:3000/api
# ───────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: stocktrack-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # Log dosyalari sinirsiz buyumesin: servis basina en fazla 3 x 10 MB.
        max-size: '10m'
        max-file: '3'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-stocktrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stocktrack}
      POSTGRES_DB: ${DB_NAME:-stocktrack}
    volumes:
      # KALICI veritabanı (named volume). Windows'ta klasör bağlamak için
      # docker-compose.yml içindeki örneğe bakın.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-stocktrack}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Önbellek + istek sınırı (Redis). Dışarıya PORT AÇILMAZ: yalnız compose ağındaki
  # api konteyneri parolayla erişir. Önbellek verisi kalıcı değildir (kayıp = yalnız
  # ilk okumalar yavaşlar); bellek dolunca en az kullanılan girdiler atılır.
  # Redis çökerse API çalışmaya devam eder (okumalar doğrudan veritabanına gider).
  redis:
    image: redis:7-alpine
    container_name: stocktrack-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      # Kök .env'de REDIS_PASSWORD belirleyin (install.sh rastgele üretir).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stocktrack-redis-local}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    container_name: stocktrack-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # Log dosyalari sinirsiz buyumesin: servis basina en fazla 3 x 10 MB.
        max-size: '10m'
        max-file: '3'
    # SIGTERM'den sonra süren isteklerin ve bağlantıların kapanması için süre (uygulama enableShutdownHooks kullanır).
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      # Redis hazır olmasa da API açılır (bellek yedeği, bağlantı gelince Redis'e geçer).
      redis:
        condition: service_healthy
        required: false
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-stocktrack-redis-local}@redis:6379/0
    volumes:
      # KALICI yedek klasörü: günlük yedekler, YÜKSELTME ÖNCESİ otomatik yedek ve yedek şifreleme
      # anahtarı burada durur. Volume olmazsa konteyner yeniden oluşturulunca (güncelleme) hepsi
      # silinirdi — şifreli yedeklerin anahtarı dahil.
      - api_backups:/app/backups
    ports:
      - '3000:3000'

  web:
    build:
      context: ./frontend
      args:
        # Boş (önerilen) → arayüz API'yi aynı kaynaktaki /api/v1 yolundan çağırır; nginx onu api servisine
        # iletir (CORS/port sorunu yok). API ayrı adreste ise: VITE_API_URL=https://api.ornek.com/api/v1
        # (nginx'teki CSP connect-src'e de o adres eklenmelidir).
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: stocktrack-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # Log dosyalari sinirsiz buyumesin: servis basina en fazla 3 x 10 MB.
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
    ports:
      - '80:80'

volumes:
  pgdata:
  api_backups:
