# HTTPS'i önündeki vekil sonlandırıyorsa (X-Forwarded-Proto: https) HSTS eklenir; düz HTTP'de boş (başlık yok).
map $http_x_forwarded_proto $hsts_header {
  https   "max-age=31536000";
  default "";
}

server {
  listen 80;
  server_name _;
  # Sürüm numarasını sızdırma (hata sayfaları ve Server başlığı).
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/snippets/security-headers.conf;

  # Gizli dosyalar (.env, .git ...) hiçbir koşulda sunulmaz.
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  # Konteyner sağlık denetimi (API'ye gitmez).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Yüklemeler için makul bir gövde sınırı (logo vb.).
  client_max_body_size 20m;

  # Sıkıştırma: JS/CSS/SVG ve API'nin JSON yanıtları gzip'lenir (HTML her
  # zaman). Küçük yanıtlar (1 KB altı) sıkıştırılmaz; proxy arkasından gelen
  # istekler de sıkıştırılır, önbellekler için "Vary: Accept-Encoding" eklenir.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript application/json text/css image/svg+xml application/manifest+json text/plain;

  # API ters proxy: '/api/...' istekleri backend (api servisi, 3000) konteynerine
  # iletilir. Böylece arayüz ile API AYNI origin'den sunulur → port/CORS sorunu yok,
  # yerel ağdaki her cihaz http://<sunucu-ip>/ ile çalışır.
  location /api/ {
    # Docker'ın gömülü DNS'i ile çalışma-zamanında çöz (api konteyneri yeniden
    # başlasa/IP değişse bile proxy kırılmaz). Değişken kullanımı, tam istek
    # URI'sinin ('/api/v1/...') olduğu gibi backend'e iletilmesini sağlar.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # SPA: bilinmeyen yollar index.html'e düşer (React Router client-side routing).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service worker ve uygulama kabuğu: her açılışta yeni sürüm denetlensin.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    # Service worker kapsamı tüm site olsun.
    add_header Service-Worker-Allowed "/";
  }
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  # Derlemedeki dosyaların listesi: service worker çevrimdışı için bunları
  # saklar (tembel yüklenen ekran parçaları dahil) — her sürümde yenilenir.
  location = /asset-manifest.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  # Uygulama manifesti ve simge: adı sabit (hash'siz) → kısa süreli önbellek.
  location ~* ^/(manifest\.webmanifest|icon\.svg)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # Statik varlıkları uzun süre önbellekle (hash'li dosya adları).
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    # TEK Cache-Control başlığı (expires + add_header ikisini birden yazıp yinelerdi).
    add_header Cache-Control "public, max-age=2592000, immutable";
    # Var olmayan hash'li dosya SPA'ya (index.html) düşmesin: eski sürümden kalan istemci 404 görsün,
    # HTML'i JS sanıp "Unexpected token <" hatası vermesin.
    try_files $uri =404;
  }
}
