# Güvenlik başlıkları. nginx'te bir "location" kendi add_header'ını tanımlarsa üst düzeydekiler
# GEÇERSİZ olur; bu yüzden her location bu dosyayı include eder.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Arayüz (React) satır içi betik/yürütme kullanmaz; stiller satır içi (style="") olabildiği için 'unsafe-inline'.
# PDF önizleme blob: iframe'i, görseller data:/blob: kullanır. API aynı kaynaktan (/api) sunulur → connect-src 'self'.
# API ayrı bir adreste ise (VITE_API_URL=https://api.ornek.com) connect-src'e o adresi ekleyin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# HSTS yalnız HTTPS isteğinde (TLS'i önündeki vekil sonlandırıyorsa X-Forwarded-Proto: https ile) gönderilir;
# düz HTTP (yerel ağ) kurulumunda boş değer başlığı hiç yazdırmaz.
add_header Strict-Transport-Security $hsts_header always;
